<mat-card *ngIf="currentUser() as user">
  <mat-card-title>Profile</mat-card-title>

  <mat-card-content>
    <div class="field">
      <label>Display name</label>
      <mat-form-field appearance="outline">
        <input matInput [formControl]="displayNameCtrl" />
      </mat-form-field>
    </div>

    <div class="field">
      <label>Email</label>
      <div class="readonly">{{ user.email }}</div>
    </div>
  </mat-card-content>

  <mat-card-actions>
    <button mat-flat-button color="primary" (click)="saveDisplayName()">Save</button>
    <button mat-stroked-button color="warn" (click)="resetPassword()">Reset password</button>
  </mat-card-actions>
</mat-card>

<div *ngIf="!currentUser()">
  <p>No user is currently signed in.</p>
</div>
