<mat-toolbar>
  <div class="title">
    <img src="faculty.png" alt="Faculty Service Logo" class="logo" />
    <h1>{{ appName }}</h1>
  </div>

  <span class="spacer"></span>

  <button mat-icon-button>
    <mat-icon> dark_mode </mat-icon>
  </button>

  <button mat-icon-button>
    <mat-icon> notifications </mat-icon>
  </button>

  <button mat-icon-button [matMenuTriggerFor]="accountMenu" aria-label="Account menu">
    <mat-icon> account_circle </mat-icon>
  </button>

  <mat-menu #accountMenu="matMenu" class="account-menu">
    <ng-container *ngIf="currentUser() as user">
      <button mat-menu-item disabled>
        <mat-icon>person</mat-icon>
        <div class="user-info">
          <div class="name">{{ user.displayName }}</div>
          <div class="email">{{ user.email }}</div>
        </div>
      </button>
      <mat-divider></mat-divider>
    </ng-container>

    <button mat-menu-item (click)="openProfile()">
      <mat-icon>settings</mat-icon>
      <span>Settings </span>
    </button>
    <button mat-menu-item (click)="confirmLogout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
